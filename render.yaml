services:
  - type: web
    name: group-prediction-points
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_NAME
        value: 群聊积分预测
      - key: DATABASE_URL
        sync: false
